name = "applied-ping-pong"
enable_filestore = false
enable_gcs_fuse = false
enable_postgres = false
enable_mysql = false
enable_api_gateway = false
enable_secrets = true
enable_slack = true
enable_automated_deploys = false
allowed_ingress_apps = ["agentic-app-builder"]

[cloudrun]
cpu = "2"
memory = "2Gi"
gpu_count = 0
min_instances = 1
max_instances = 1
port = 0

[cloudrun.env_vars]
ADMIN_PASSPHRASE = "pingpong@ai"

[metadata]
owner = "prakhar.kumar@applied.co"
description = "Go Slack bot demo app - demonstrates app mentions, DMs, channel messages, forms, and member listing"
maintainers = ["prakhar.kumar@applied.co"]
